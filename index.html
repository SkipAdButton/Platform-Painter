<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Template</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
        }

        canvas {
            position: absolute;
            top: calc(50vh - 384px);
            left: calc(50vw - 680px);
        }
    </style>
</head>

<body>
    <canvas id="canvas" width="1360" height="768"></canvas>

    <script>
        // Classes
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.g = 0;

                this.jumpAvailable = false;
                this.grounded = false;
                this.size = 20;
                this.platformLimit = 2
                this.lockMovement = false
                this.wallJump = false

                this.moveForce = 0
            }
            move(delta) {
                if (!this.lockMovement) {
                    if (keys["a"] || keys["arrowleft"]) {
                        if (this.grounded) {
                            this.moveForce = -350
                        } else {
                            this.moveForce -= 1700 * delta;
                            this.platcol("left");
                        }
                    }
                    if (keys["s"] || keys["arrowdown"]) {
                        // this.y += 500 * delta;
                        if (this.g < 0) {
                            this.g = 0
                        }
                        this.platcol("down");
                    }
                    if (keys["d"] || keys["arrowright"] || this.forceRight) {
                        if (this.grounded) {
                            this.moveForce = 350
                        } else {
                            this.moveForce += 1700 * delta;
                            this.platcol("right");
                        }
                    }
                    if (keys[" "]) {
                        if (this.jumpAvailable) {
                            this.g = -600;
                            this.jumpAvailable = false;
                        }
                        // else if (this.wallJump) {
                        //  if (keys["d"]) {
                        //      this.g = -1000;
                        //      this.moveForce = -300
                        //  } else if (keys["a"]) {
                        //      this.g = -1000;
                        //      this.moveForce = 300
                        //  }
                        // }
                    }
                }
                if (!this.grounded) {
                    this.g += 2350 * delta;
                }
                if (this.moveForce > 350) {
                    this.moveForce = 350
                } else if (this.moveForce < -350) {
                    this.moveForce = -350
                }
                if (!this.lockMovement) {
                    this.x += this.moveForce * delta
                }
                if (this.moveForce > 0) {
                    this.platcol("right");
                } else if (this.moveForce < 0) {
                    this.platcol("left");
                }
                if (this.grounded && !(keys["a"] || keys["d"] || keys["arrowleft"] || keys["arrowright"])) {
                    this.moveForce = 0
                }
                this.y += this.g * delta;
                this.grounded = false;
                this.platcol("gravity");
                if (this.g != 0) {
                    this.jumpAvailable = false
                }
            }
            platcol(dir) {
                if (dir == "up") {
                    for (let i = 0; i < platforms.length; i++) {
                        if (playerPlatformCol(platforms[i])) {
                            this.y = platformInfo(platforms[i]).bottom;
                        }
                    }
                } else if (dir == "left") {
                    for (let i = 0; i < platforms.length; i++) {
                        if (playerPlatformCol(platforms[i])) {
                            this.x = platformInfo(platforms[i]).right;
                            this.wallJump = true
                            this.moveForce = 0
                            this.g = 50
                            if (keys[" "]) {
                                this.g = -475;
                                this.moveForce = 1000
                            }
                        }
                    }
                } else if (dir == "down") {
                    for (let i = 0; i < platforms.length; i++) {
                        if (playerPlatformCol(platforms[i])) {
                            this.y =
                                platformInfo(platforms[i]).top - this.size;
                        }
                    }
                } else if (dir == "right") {
                    for (let i = 0; i < platforms.length; i++) {
                        if (playerPlatformCol(platforms[i])) {
                            this.x = platformInfo(platforms[i]).left - this.size;
                            this.wallJump = true
                            this.moveForce = 0
                            this.g = 50
                            if (keys[" "]) {
                                this.g = -475;
                                this.moveForce = -1000
                            }
                        }
                    }
                } else if (dir == "gravity") {
                    if (this.g < 0) {
                        for (let i = 0; i < platforms.length; i++) {
                            if (playerPlatformCol(platforms[i])) {
                                this.y = platformInfo(platforms[i]).bottom;
                                this.g = 0;
                            }
                        }
                    } else if (this.g > 0) {
                        for (let i = 0; i < platforms.length; i++) {
                            if (playerPlatformCol(platforms[i])) {
                                this.y =
                                    platformInfo(platforms[i]).top -
                                    this.size;
                                this.g = 0;
                                this.jumpAvailable = true;
                                this.grounded = true
                            }
                        }
                    }
                }
            }
        }
        class Platform {
            constructor(x1, y1, x2, y2) {
                this.x1 = x1;
                this.y1 = y1;
                this.x2 = x2;
                this.y2 = y2;
            }
        }
        class EvilPlatform {
            constructor(x1, y1, x2, y2) {
                this.x1 = x1;
                this.y1 = y1;
                this.x2 = x2;
                this.y2 = y2;
            }
        }
        class Flag {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 20
            }
        }
        // Const
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const platforms = [];
        const evilPlatforms = [];
        const keys = {};
        const mouse = {
            x: 0,
            y: 0,
            down: false,
            savedX1: undefined,
            savedX2: undefined,
            savedY1: undefined,
            savedY2: undefined,
        };
        const gameState = {
            level: 1
        }

        // Vars
        let lastTime = 0;

        let player = new Player(100, 100);
        let flag = new Flag(0, 0)
        let text = "Move with [A D] or [ARROW KEYS]"

        // Event listener
        document.addEventListener("keydown", (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() == "r") {
                loadLevel(gameState.level)
            }
        });
        document.addEventListener("keyup", (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener("mousedown", (e) => {
            mouse.down = true;
            mouse.savedX1 = mouse.x;
            mouse.savedY1 = mouse.y;
        });
        canvas.addEventListener("mouseup", (e) => {
            mouse.down = false;
            mouse.savedX2 = mouse.x;
            mouse.savedY2 = mouse.y;
            placePlatform(
                mouse.savedX1,
                mouse.savedY1,
                mouse.savedX2,
                mouse.savedY2,
            );
            mouse.savedX1 = undefined;
            mouse.savedY1 = undefined;
            mouse.savedX2 = undefined;
            mouse.savedY2 = undefined;
        });

        function draw() {
            // Reset
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#F5EFD6";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Player
            ctx.fillStyle = "#333";
            ctx.fillRect(player.x, player.y, player.size, player.size);

            // Platforms
            ctx.fillStyle = "#F32";
            for (let i = 0; i < evilPlatforms.length; i++) {
                ctx.fillRect(
                    evilPlatforms[i].x1,
                    evilPlatforms[i].y1,
                    evilPlatforms[i].x2 - evilPlatforms[i].x1,
                    evilPlatforms[i].y2 - evilPlatforms[i].y1,
                );
            }

            ctx.fillStyle = "#F75";
            for (let i = 0; i < platforms.length; i++) {
                ctx.fillRect(
                    platforms[i].x1,
                    platforms[i].y1,
                    platforms[i].x2 - platforms[i].x1,
                    platforms[i].y2 - platforms[i].y1,
                );
            }

            // Platform outline
            if (
                mouse.savedX1 != undefined &&
                mouse.savedY1 != undefined &&
                mouse.down
            ) {
                ctx.strokeStyle = "#A20";
                ctx.beginPath();
                ctx.setLineDash([8, 6]);
                ctx.rect(
                    mouse.savedX1,
                    mouse.savedY1,
                    mouse.x - mouse.savedX1,
                    mouse.y - mouse.savedY1,
                );
                ctx.stroke();
                ctx.setLineDash([]);
            }
            // Flag
            ctx.fillStyle = "#090";
            ctx.fillRect(flag.x + 3, flag.y + 3, flag.size - 3, flag.size - 10);
            ctx.fillRect(flag.x + 15, flag.y, flag.size - 15, flag.size);

            // UI
            // Platform Limit
            for (let i = 0; i < player.platformLimit; i++) {
                ctx.fillStyle = "#333";
                ctx.fillRect(10 + (35 * i), canvas.height - 40, 30, 30)
                ctx.fillStyle = "#F75";
                ctx.fillRect(14 + (35 * i), canvas.height - 36, 22, 22)
            }
            // Text
            ctx.font = "24px monospace"
            ctx.fillStyle = "#111"
            ctx.fillText(text, 50, 75)
        }

        // function placePlatform(x1, y1, x2, y2) {
        //     console.log()
        //     if (player.platformLimit > 0 && mouse.savedX1 != undefined && mouse.savedY1 != undefined && mouse.savedX2 != undefined && mouse.savedY2 != undefined) {
        //         platforms.push(new Platform(x1, y1, x2, y2));
        //         console.log(platformInfo(platforms[platforms.length - 1]));
        //         player.platformLimit--
        //     }
        // }

        function placePlatform(x1, y1, x2, y2) {

    		const newPlatform = platformInfo({ x1, y1, x2, y2 });

    		const overlapsPlayer =
     		   	newPlatform.left < player.x + player.size &&
        		newPlatform.right > player.x &&
        		newPlatform.top < player.y + player.size &&
        		newPlatform.bottom > player.y;

    		const overlapsEvil = evilPlatforms.some(platform => {
        		const evil = platformInfo(platform);

        		return (
        	    newPlatform.left < evil.right &&
        	    newPlatform.right > evil.left &&
        	    newPlatform.top < evil.bottom &&
        	    newPlatform.bottom > evil.top
        	);});

    		const conflicts =
        		mouse.savedX1 == undefined ||
        		mouse.savedY1 == undefined ||
        		mouse.savedX2 == undefined ||
        		mouse.savedY2 == undefined ||
        		overlapsPlayer ||
        		overlapsEvil;

    		if (!conflicts && player.platformLimit > 0) {
    		    platforms.push(new Platform(x1, y1, x2, y2));
    		    player.platformLimit--;
    		}
		}

        function playerPlatformCol(platform) {
            return (
                player.x < platformInfo(platform).right &&
                player.x + player.size > platformInfo(platform).left &&
                player.y < platformInfo(platform).bottom &&
                player.y + player.size > platformInfo(platform).top
            );
        }

        function platformInfo(platform) {
            return {
                left: Math.min(platform.x1, platform.x2),
                right: Math.max(platform.x1, platform.x2),
                top: Math.min(platform.y1, platform.y2),
                bottom: Math.max(platform.y1, platform.y2),
            };
        }

        // Level Handler
        function loadLevel(level) {
            if (level == 1) {
                player.lockMovement = true
                setTimeout((e) => { player.lockMovement = false }, 500)
                platforms.splice(0, platforms.length)
                evilPlatforms.splice(0, evilPlatforms.length)
                text = "Move with [A D] or [ARROW KEYS]."

                platforms.push(new Platform(0, canvas.height * 6 / 8, canvas.width, canvas.height));

                flag = new Flag(canvas.width - 300, canvas.height * 6 / 8 - 20)
                player.x = 150
                player.y = canvas.height * 6 / 8 - 20
                player.platformLimit = 0
            } else if (level == 2) {
                player.lockMovement = true
                setTimeout((e) => { player.lockMovement = false }, 500)
                platforms.splice(0, platforms.length)
                evilPlatforms.splice(0, evilPlatforms.length)
                text = "Jump with [SPACE]."

                platforms.push(new Platform(0, canvas.height * 6 / 8, canvas.width, canvas.height));
                platforms.push(new Platform(canvas.width / 2, canvas.height * 11 / 16, canvas.width, canvas.height));

                flag = new Flag(canvas.width - 300, canvas.height * 11 / 16 - 20)
                player.x = 150
                player.y = canvas.height * 6 / 8 - 20
                player.platformLimit = 0
            } else if (level == 3) {
                player.lockMovement = true
                setTimeout((e) => { player.lockMovement = false }, 500)
                platforms.splice(0, platforms.length)
                evilPlatforms.splice(0, evilPlatforms.length)
                platforms.push(new Platform(50, 500, 250, 600));
                platforms.push(new Platform(1050, 500, 1250, 600));
                flag = new Flag(1150, 480)
                player.x = 100
                player.y = 480
                player.platformLimit = 2
                text = "Drag your mouse to create a platform."
            } else if (level == 4) {
                player.lockMovement = true
                setTimeout((e) => { player.lockMovement = false }, 500)
                platforms.splice(0, platforms.length)
                evilPlatforms.splice(0, evilPlatforms.length)
                text = "Hold space into a wall to wall-jump. TIP: Only hold space while wall-jumping."

                platforms.push(new Platform(0, canvas.height * 6 / 8, canvas.width / 3, canvas.height));
                platforms.push(new Platform(canvas.width * 2 / 3, canvas.height * 6 / 8, canvas.width, canvas.height));

                platforms.push(new Platform(canvas.width - 300, 0, canvas.width - 200, canvas.height - 250));
                platforms.push(new Platform(canvas.width - 300, 0, canvas.width, 10));

                platforms.push(new Platform(canvas.width - 100, canvas.height / 4, canvas.width, canvas.height));
                platforms.push(new Platform(canvas.width - 10, 0, canvas.width, canvas.height));

                flag = new Flag(canvas.width - 50, canvas.height / 4 - 20)
                player.x = 150
                player.y = canvas.height * 6 / 8 - 20
                player.platformLimit = 1
            } else if (level == 5) {
                player.lockMovement = true
                setTimeout((e) => { player.lockMovement = false }, 500)
                platforms.splice(0, platforms.length)
                evilPlatforms.splice(0, evilPlatforms.length)
                text = "1. Simple jumps. TIP: Press R to reset"

                platforms.push(new Platform(100, canvas.height - 100, 200, canvas.height - 200));
                platforms.push(new Platform(300, canvas.height - 150, 400, canvas.height - 250));
                platforms.push(new Platform(700, canvas.height - 250, 800, canvas.height - 350));
                platforms.push(new Platform(1100, canvas.height - 350, 1200, canvas.height - 450));

                flag = new Flag(1150, canvas.height - 470)
                player.x = 150
                player.y = canvas.height - 220
                player.platformLimit = 2
            } else if (level == 6) {
                player.lockMovement = true
                setTimeout((e) => { player.lockMovement = false }, 500)
                platforms.splice(0, platforms.length)
                evilPlatforms.splice(0, evilPlatforms.length)
                text = "2. Roundabout. TIP: You cannot draw over red platforms"

                platforms.push(new Platform(0, 150, 200, 250));
                evilPlatforms.push(new EvilPlatform(200, 200, canvas.width - 300, canvas.height - 150));
                platforms.push(new Platform(0, 350, 50, canvas.height));
                platforms.push(new Platform(0, 250, 10, canvas.height));

                flag = new Flag(15, 330)
                player.x = 100
                player.y = 130
                player.platformLimit = 3
            } else if (level == 7) {
                player.lockMovement = true
                setTimeout((e) => { player.lockMovement = false }, 500)
                platforms.splice(0, platforms.length)
                evilPlatforms.splice(0, evilPlatforms.length)
                text = "3. Low Blow."

                platforms.push(new Platform(100, 400, 200, 500));
                platforms.push(new Platform(1100, 600, 1200, 700));
                evilPlatforms.push(new EvilPlatform(300, 500, 1000, 600));
                evilPlatforms.push(new EvilPlatform(300, 100, 1000, 200));
                evilPlatforms.push(new EvilPlatform(300, 300, 325, 500));
                evilPlatforms.push(new EvilPlatform(640, 200, 660, 400));

                evilPlatforms.push(new EvilPlatform(975, 300, 1000, 500));

                flag = new Flag(1150, 580)
                player.x = 100
                player.y = 130
                player.platformLimit = 2
            } else if (level == 8) {
                player.lockMovement = true
                setTimeout((e) => { player.lockMovement = false }, 500)
                platforms.splice(0, platforms.length)
                evilPlatforms.splice(0, evilPlatforms.length)
                text = "4. Make it count."

                platforms.push(new Platform(0, canvas.height - 150, canvas.width, canvas.height));
                platforms.push(new Platform(1200, 200, canvas.width, canvas.height));
                platforms.push(new Platform(50, 200, 150, 250));

                flag = new Flag(85, 180)
                player.x = 100
                player.y = canvas.height - 170
                player.platformLimit = 1
            } else if (level == 9) {
                player.lockMovement = true
                setTimeout((e) => { player.lockMovement = false }, 500)
                platforms.splice(0, platforms.length)
                evilPlatforms.splice(0, evilPlatforms.length)
                text = "5. Up & Under."

                platforms.push(new Platform(100, 600, 300, 650));
                platforms.push(new Platform(400, canvas.height/4, 425, canvas.height));
                platforms.push(new Platform(850, 0, 875, canvas.height * 3/4));
                platforms.push(new Platform(1050, 300, 1200, 350));

                flag = new Flag(1100, 280)
                player.x = 150
                player.y = 580
                player.platformLimit = 3
            }
        }

        function flagTouch() {
            if (
                player.x < flag.x + flag.size &&
                player.x + player.size > flag.x &&
                player.y < flag.y + flag.size &&
                player.y + player.size > flag.y
            ) {
                gameState.level++
                loadLevel(gameState.level)
            }
        }

        loadLevel(1)

        // Delta time / Loop functions
        function loop(time) {
            // Creating delta
            let delta = time - lastTime;
            delta = delta / 1000;
            delta = Math.min(delta, 0.05);
            // Run functions
            if (player != undefined) {
                player.wallJump = false;
                player.move(delta);
                // player.wallJump = false
            }
            flagTouch()

            for (let i = 0; i < evilPlatforms.length; i++) {
                if (playerPlatformCol(evilPlatforms[i])) {
                    loadLevel(gameState.level)
                }
            }
            draw(); // Draw last

            // Recall
            lastTime = time;
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>

</html>
